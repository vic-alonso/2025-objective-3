openapi: 3.0.0
info:
  title: Article Recommender
  version: 1.0.0
servers:
  - url: https://us-central1-lineage-alt-test.cloudfunctions.net
paths:
  /vic-recommend-article:
    get:
      operationId: recommend_article
      summary: recommend an article based on similarity of embeddings
      parameters:
        - name: phrase
          in: query
          required: true
          schema:
            type: string
          description: Phrase for search an article
      responses:
        '200':
          description: Recommended article
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  url:
                    type: string
                  similarity:
                    type: number
        '400':
          description: Phrase parameters not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Articles not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
