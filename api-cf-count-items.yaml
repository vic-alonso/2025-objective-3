openapi: 3.0.0
info:
  title: GCS Bucket Counter
  version: 1.0.0
servers:
  - url: https://europe-west1-lineage-alt-test.cloudfunctions.net
paths:
  /count_items_in_the_bucket:
    get:
      operationId: count_items_in_bucket
      summary: Cuenta items en un bucket de GCS
      parameters:
        - name: bucket_name
          in: query
          schema:
            type: string
            default: vic-objective-3
          description: Nombre del bucket
      responses:
        '200':
          description: Número de items
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket:
                    type: string
                  items:
                    type: integer
